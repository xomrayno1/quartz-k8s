server:
  port: ${APP_PORT:8080}
spring:
  liquibase:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10000MB
      max-request-size: 10000MB
  application:
    name: quartz-demo-k8s
  datasource:
    url:  ${CONFIG_SERVER_DB_URL:jdbc:mysql://localhost:3308/quartzDemo}?createDatabaseIfNotExist=true&useUnicode=yes&characterEncoding=UTF-8
    username: ${CONFIG_SERVER_DB_USERNAME:root}
    password: ${CONFIG_SERVER_DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    show-sql: true
    open-in-view: false
    generate-ddl: false
    hibernate:
      ddl-auto: none
  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: never
    properties:
      org:
        quartz:
          scheduler:
            instanceId: AUTO
            instanceName: QuartzScheduler
          jobStore:
            isClustered: true
            #clusterCheckinInterval: 10000  # (ms) mặc định 15s check healthy node cua job
          threadPool:
            threadCount: 15     
            
